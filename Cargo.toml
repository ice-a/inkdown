[package]
name = "inkdown"
version = "0.1.8"
edition = "2024"
description = "Inkdown - a beautifully crafted Markdown editor built with GPUI Kit"
authors = ["ice-a"]
repository = "https://github.com/ice-a/inkdown"

[dependencies]
gpui-kit = { version = "0.9.1", features = ["syntect"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
arboard = "3.7"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
dirs = "6"
chrono = { version = "0.4", features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
# Same grammar set and versions gpui-kit already uses. Feature flags must
# mirror kit's (fancy regex, no default features) or unification would pull
# the onig C backend into the build.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
# Local inference for the optional code checker (llama.cpp bindings).
# Default features enable OpenMP: it needs libomp on macOS (breaks the build
# and would ship a binary users cannot launch) and pulls VCOMP140.DLL into
# the Windows exe, which stock systems do not have — keep it off everywhere.
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common"] }

[features]
default = []
# Keep the Windows console subsystem for development/debugging.
console = []

[build-dependencies]
embed-resource = "3.0"

[profile.dev]
opt-level = 0

[profile.dev.package.gpui-pre]
opt-level = 2
[profile.dev.package.gpui-component]
opt-level = 2
[profile.dev.package.gpui-base]
opt-level = 2
[profile.dev.package.rustybuzz]
opt-level = 2
[profile.dev.package.taffy]
opt-level = 2
[profile.dev.package.ttf-parser]
opt-level = 2
