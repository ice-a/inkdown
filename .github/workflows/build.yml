name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset_os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows-x86_64
            package_ext: msi
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux-x86_64
            package_ext: deb
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_os: macos-aarch64
            package_ext: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Same list as gpui-kit's script/install-linux.sh (Ubuntu 24.04).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev \
            vulkan-validationlayers libvulkan1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # Replaces the system ld on Linux; a no-op elsewhere.
      - uses: rui314/setup-mold@v1

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Resolve package name
        run: |
          # VERSION labels the file; PKG_VERSION must be numeric for MSI/DEB
          # metadata on non-tag builds.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
            PKG_VERSION="${VERSION#v}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
            PKG_VERSION="0.0.0"
          fi
          NAME="Inkdown-${VERSION}-${{ matrix.asset_os }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
          echo "PACKAGE_SETUP=" >> "$GITHUB_ENV"

      - name: Package (MSI)
        if: runner.os == 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/inkdown.exe" inkdown.exe
          # WiX 7 requires accepting the OSMF EULA; 5.x is Apache-licensed
          # and supports the v4 schema used by packaging/windows/main.wxs.
          dotnet tool install --global wix --version 5.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix build -arch x86 \
            -d Version="${PKG_VERSION}" \
            -d SourceDir="$(pwd -W)" \
            -o "${NAME}.msi" \
            packaging/windows/main.wxs
          ls -lh "${NAME}.msi"
          echo "PACKAGE=${NAME}.msi" >> "$GITHUB_ENV"

      - name: Package (guided Setup.exe)
        if: runner.os == 'Windows'
        run: |
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$MAKENSIS" ]; then
            choco install nsis --no-progress -y
          fi
          # /D arguments are Windows paths; stop Git Bash from rewriting them.
          ROOT_WIN="$(cygpath -w "$PWD")"
          OUT_WIN="$(cygpath -w "$PWD/${NAME}-setup.exe")"
          MSYS_NO_PATHCONV=1 "$MAKENSIS" \
            /DVERSION="${PKG_VERSION}" \
            /DROOT="$ROOT_WIN" \
            /DOUTFILE="$OUT_WIN" \
            packaging/windows/setup.nsi
          ls -lh "${NAME}-setup.exe"
          echo "PACKAGE_SETUP=${NAME}-setup.exe" >> "$GITHUB_ENV"

      - name: Package (DMG)
        if: runner.os == 'macOS'
        run: |
          APP="Inkdown.app"
          rm -rf "$APP" dmgroot
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/inkdown" "$APP/Contents/MacOS/inkdown"
          chmod +x "$APP/Contents/MacOS/inkdown"
          cp assets/icon/inkdown.icns "$APP/Contents/Resources/inkdown.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Inkdown</string>
            <key>CFBundleDisplayName</key><string>Inkdown</string>
            <key>CFBundleIdentifier</key><string>com.ice-a.inkdown</string>
            <key>CFBundleExecutable</key><string>inkdown</string>
            <key>CFBundleIconFile</key><string>inkdown.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${PKG_VERSION}</string>
            <key>CFBundleVersion</key><string>${PKG_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature: not notarized, but Gatekeeper can offer the
          # usual right-click-open path on first launch.
          codesign --force --deep --sign - "$APP" || true
          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Inkdown" -srcfolder dmgroot \
            -ov -format UDZO "${NAME}.dmg"
          ls -lh "${NAME}.dmg"
          echo "PACKAGE=${NAME}.dmg" >> "$GITHUB_ENV"

      - name: Package (DEB)
        if: runner.os == 'Linux'
        run: |
          cp "target/${{ matrix.target }}/release/inkdown" inkdown
          DEB_ROOT=deb-root
          mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr/bin" \
            "$DEB_ROOT/usr/share/applications" "$DEB_ROOT/usr/share/pixmaps"
          install -m 755 inkdown "$DEB_ROOT/usr/bin/inkdown"
          for size in 16 24 32 48 64 128 256 512; do
            install -Dm644 "assets/icon/inkdown-${size}.png" \
              "$DEB_ROOT/usr/share/icons/hicolor/${size}x${size}/apps/inkdown.png"
          done
          install -Dm644 assets/icon/inkdown-512.png \
            "$DEB_ROOT/usr/share/pixmaps/inkdown.png"
          cat > "$DEB_ROOT/usr/share/applications/inkdown.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Inkdown
          Comment=Markdown editor built with GPUI Kit
          Exec=inkdown
          Icon=inkdown
          Type=Application
          Categories=Office;TextEditor;
          Keywords=markdown;editor;text;
          StartupWMClass=inkdown
          Terminal=false
          DESKTOP
          # Resolve the shared libraries the binary actually needs into
          # package names, so Depends stays correct across runner images.
          DEPS=$(ldd inkdown | awk '{print $3}' | grep '^/' | sort -u \
            | while read -r lib; do dpkg -S "$lib" 2>/dev/null | head -1 | cut -d: -f1; done \
            | sort -u | grep -v '^inkdown$' | paste -sd, -)
          cat > "$DEB_ROOT/DEBIAN/control" <<CONTROL
          Package: inkdown
          Version: ${PKG_VERSION}
          Section: editors
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS:-libc6}
          Maintainer: ice-a
          Description: Inkdown - Markdown editor built with GPUI Kit
           Write, preview and publish Markdown: local folders, image hosting,
           WeChat / cnblogs publishing and AI writing in one native app.
          CONTROL
          dpkg-deb --build --root-owner-group "$DEB_ROOT" "${NAME}.deb"
          ls -lh "${NAME}.deb"
          echo "PACKAGE=${NAME}.deb" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ env.NAME }}-setup
          path: ${{ env.PACKAGE_SETUP }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Curated install/feature notes first, then the generated changelog.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            -q .body > generated.md
          cat .github/release-notes.md generated.md > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.msi dist/*.dmg dist/*.deb dist/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Inkdown $GITHUB_REF_NAME" \
            --notes-file notes.md
