  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#ink)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none" stroke="#5a4b39" stroke-opacity="0.56" stroke-width="6"/>

